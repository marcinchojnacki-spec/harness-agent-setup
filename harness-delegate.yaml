# Harness Delegate Configuration
# This file configures the Harness Delegate for macOS

apiVersion: v1
kind: Delegate
metadata:
  name: harness-delegate-macos
  namespace: harness-delegate

spec:
  # Delegate name - change this to your delegate name
  delegateName: "my-macos-delegate"
  
  # Account ID from Harness
  accountId: "YOUR_ACCOUNT_ID"
  
  # Manager host - typically the Harness SaaS URL
  managerHost: "https://app.harness.io"
  
  # Delegate token - get this from Harness UI
  delegateToken: "ZWM3MGNkNDA5ZmYwMTA5NTQyOTU4NjRlODYyNjJhOGU="
  
  # Resource settings
  resources:
    limits:
      cpu: "1000m"
      memory: "2048Mi"
    requests:
      cpu: "500m"
      memory: "1024Mi"
  
  # Enable logging
  logLevel: "INFO"
  
  # Health check
  healthCheck:
    enabled: true
    interval: 30
    timeout: 10

  # Proxy settings (optional)
  proxy:
    enabled: false
    host: ""
    port: 0
    username: ""
    password: ""
